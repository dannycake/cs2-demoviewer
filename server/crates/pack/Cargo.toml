[package]
name = "demoviewer-pack"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: event data carries floats; write→read must return them bit-exact.
serde_json = { version = "1", features = ["float_roundtrip"] }
