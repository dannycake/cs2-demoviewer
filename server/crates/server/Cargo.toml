[package]
name = "demoviewer-server"
version = "0.1.0"
edition = "2021"
publish = false
# Two bins (the server and demoviewer-pack-cli): plain `cargo run -p demoviewer-server` runs the server.
default-run = "demoviewer-server"

[dependencies]
demoviewer-pack = { path = "../pack" }
parser = { path = "../../vendor/parser" }
# Same major versions the vendored parser uses: `ParserInputs` takes `ahash::AHashMap`.
ahash = "0.8"
memmap2 = "0.9"
serde_json = "1"
# URL ingest. reqwest 0.12 + rustls-tls = ring + bundled webpki roots: no system CA store
# needed in the slim runtime image, no cmake for aws-lc. No `stream` feature: the body is
# read with `Response::chunk`, which is the same streaming without futures-util.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
bzip2 = "0.6"
flate2 = "1"
zstd = "0.13"
# HTTP API, job runner and store.
axum = "0.8"
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
bs58 = "0.5"
# The version the vendored parser already pulls in.
rand = "0.8"
tracing = "0.1"
# setrlimit for the parse worker's memory cap; the version tokio already pulls in.
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Match pages' preview images: drawing, PNG in and out, and text in the site's face.
tiny-skia = { version = "0.11", features = ["png-format"] }
ab_glyph = "0.2"
# The preview card as a JPEG: a screenshot is a tenth of the size it is as a PNG.
jpeg-encoder = "0.6"
# Players' avatars on their cards: Steam serves them as JPEGs.
jpeg-decoder = "0.3"

[dev-dependencies]
futures-util = "0.3"
# Parses the Atom feeds in the tests.
roxmltree = "0.20"
tempfile = "3"
# Paused time in the Steam gate's tests.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "demoviewer-pack-cli"
path = "src/bin/pack.rs"
