<!doctype html><html><head><meta charset="utf-8"><title>rgbm upload check</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.186.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.186.1/examples/jsm/"}}</script>
</head><body><script type="module">
// Spike (D5): what does WebGL actually receive from an RGBM WebP? Draws ?f=<webp> 1:1 with nearest
// sampling into an RGBA8 target, once from an <img> (TextureLoader) and once from an ImageBitmap with
// premultiplyAlpha 'none', and exposes the pixels as window.__img / window.__bmp.
import * as THREE from 'three';
const file = new URLSearchParams(location.search).get('f');
const r = new THREE.WebGLRenderer();
async function read(tex) {
  tex.flipY = false; tex.colorSpace = THREE.NoColorSpace; tex.magFilter = tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false; tex.needsUpdate = true;
  const w = tex.image.width, h = tex.image.height;
  const rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.UnsignedByteType });
  const mat = new THREE.ShaderMaterial({ uniforms: { t: { value: tex } }, vertexShader: 'varying vec2 v; void main(){ v = uv; gl_Position = vec4(position.xy * 2.0, 0.0, 1.0); }',
    fragmentShader: 'uniform sampler2D t; varying vec2 v; void main(){ gl_FragColor = texture2D(t, v); }', blending: THREE.NoBlending });
  const scene = new THREE.Scene(); scene.add(new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat));
  r.setRenderTarget(rt); r.render(scene, new THREE.Camera());
  const px = new Uint8Array(w * h * 4); r.readRenderTargetPixels(rt, 0, 0, w, h, px);
  return Array.from(px);
}
window.__img = await read(await new THREE.TextureLoader().loadAsync(file));
window.__bmp = await read(new THREE.Texture(await new THREE.ImageBitmapLoader().setOptions({ imageOrientation: 'none', premultiplyAlpha: 'none', colorSpaceConversion: 'none' }).loadAsync(file)));
window.__ready = true;
</script></body></html>
