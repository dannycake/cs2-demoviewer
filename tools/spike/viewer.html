<style>body{margin:0;background:#0b0d10}canvas{display:block}#hud{position:fixed;left:8px;top:8px;color:#ddd;font:13px monospace}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.186.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.186.1/examples/jsm/"}}</script>
</head><body><div id="hud">loading</div><script type="module">

  if (q.get('lmnearest') === '1') { lmTex.magFilter = THREE.NearestFilter; lmTex.minFilter = THREE.NearestFilter; lmTex.generateMipmaps = false; }
  lmTex.needsUpdate = true;

const ATM = { de_mirage: { sky: '8fc0ee', sun: 'fdcc99', hemiSky: 'fdeadf', hemiGround: 'd7ab7c', exposure: 1.6 },
  de_nuke: { sky: 'a9c8e6', sun: 'fbf5e8', hemiSky: 'd8e9f7', hemiGround: '8d979e', exposure: 1.81 } };

scene.add(new THREE.HemisphereLight(today ? '#' + today.hemiSky : 0xdfe9ff, today ? '#' + today.hemiGround : 0x6b5a46, hemiI)); const sun = new THREE.DirectionalLight(today ? '#' + today.sun : 0xfff2e0, sunI); sun.position.set(40, 80, 20); scene.add(sun);

  const palette = { floor:0x8a7f6a, wall:0xb59f82, wood:0x7a5a3a, metal:0x6b6f75, marble:0xcfc8b8, brick:0xa8684c, plaster:0xc9b08f, tile:0x9c8f7a, tree:0x4f7a3a, rug:0x8a3a3a };
  let tris = 0;
  g.scene.traverse(o => { if (o.isMesh) { tris += o.geometry.index ? o.geometry.index.count/3 : o.geometry.attributes.position.count/3;
    if (flat) { const n = (o.name + ' ' + (o.material?.name||'')).toLowerCase(); let c = 0x9a9a9a; for (const k in palette) if (n.includes(k)) { c = palette[k]; break; }
      o.material = new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.9 }); }
    const src = o.material; const keep = src ? { map: src.map, color: src.color, vertexColors: q.get('ao')==='1' && !!o.geometry.attributes.color, alphaTest: src.alphaTest || (src.transparent ? 0.5 : 0), transparent: false, side: src.side } : null;
    if (q.get('unlit')==='1' && src) { o.material = new THREE.MeshBasicMaterial(keep); }

      const lit = !!o.geometry.attributes.uv1;

        lightMap: lit ? lmTex : null, lightMapIntensity: Math.PI * +(q.get('lmscale') || 1) });
      if (!lit && q.get('unlm')) o.material.color.set('#' + q.get('unlm'));
      // vl=<scale>: unlightmapped primitives lit by their COLOR_0 vertex light (shrink-lm --vertexlight), x scale.
      if (!lit && q.get('vl') && o.geometry.attributes.color) { o.material.vertexColors = true; o.material.color.setScalar(+q.get('vl')); }
      if (lit && rgbmRange) o.material.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('lightMapTexel.rgb * lightMapIntensity', `lightMapTexel.rgb * lightMapTexel.a * ${rgbmRange.toFixed(1)} * lightMapIntensity`); };
      // lmsqrt=<range>: the shipped lightmap since Task 4's fix round, sqrt(light / range) squared.
      if (lit && sqrtRange) o.material.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('lightMapTexel.rgb * lightMapIntensity', `lightMapTexel.rgb * lightMapTexel.rgb * ${sqrtRange.toFixed(1)} * lightMapIntensity`); };
    }
    if (q.get('lit')==='1' && src) {
      const smooth = q.get('smooth')==='1';
      if (smooth && !o.geometry.attributes.normal) o.geometry.computeVertexNormals();
      if (keep.alphaTest > 0) keep.side = THREE.DoubleSide;
      o.material = new THREE.MeshLambertMaterial({ ...keep, flatShading: !smooth });
      if (keep.map) { keep.map.anisotropy = +(q.get('aniso')||1); keep.map.needsUpdate = true; }
      if (q.get('shadow')==='1') { o.castShadow = true; o.receiveShadow = true; }
    }
    if (vcRange && src && o.geometry.attributes.color && !(lmTex && o.geometry.attributes.uv1)) {
      // base=0 drops the colour texture here too, so the light alone shows (seams, Task 4).
      o.material = new THREE.MeshBasicMaterial({ ...keep, map: q.get('base') === '0' ? null : keep.map, color: q.get('base') === '0' ? 0xffffff : keep.color, vertexColors: true });
      o.material.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', `diffuseColor.rgb *= vColor.rgb * vColor.rgb * ${vcRange.toFixed(1)};`); };
    }
    if (today && src) {
      if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
      o.material = new THREE.MeshLambertMaterial({ ...keep, vertexColors: !!o.geometry.attributes.color, side: keep.alphaTest > 0 ? THREE.DoubleSide : keep.side });
      o.castShadow = true; o.receiveShadow = true;
    }
    if (q.get('normals')==='1') { o.geometry.computeVertexNormals(); }
    if (q.get('nocolor')==='1' && o.material) { o.material.vertexColors = false; o.material.needsUpdate = true; }
    if (!window.__dbg && o.material?.map) { window.__dbg = {map: !!o.material.map, vc: o.material.vertexColors, hasColorAttr: !!o.geometry.attributes.color, metal: o.material.metalness, rough: o.material.roughness, emissive: o.material.emissive?.getHex()}; } } });

  console.log('DBG', JSON.stringify(window.__dbg));

  const box = new THREE.Box3().setFromObject(g.scene); const c = box.getCenter(new THREE.Vector3()); const s = box.getSize(new THREE.Vector3());

  }
  if (q.get('shadow')==='1') { const ext = +(q.get('shadowext')||0) || Math.max(s.x, s.z) * 0.6; sun.position.set(c.x + 40, c.y + 80, c.z + 20); sun.target.position.copy(c); scene.add(sun.target); const sc = sun.shadow.camera; sc.left = -ext; sc.right = ext; sc.top = ext; sc.bottom = -ext; sc.near = 1; sc.far = 400; sc.updateProjectionMatrix(); }
  const off = (q.get('cam')||'').split(',').map(Number); const at = (q.get('at')||'').split(',').map(Number);
  if (off.length===3 && !off.some(isNaN)) { cam.position.set(c.x+off[0], c.y+off[1], c.z+off[2]); } else { cam.position.set(c.x + s.x*0.55, c.y + s.y*2.2, c.z + s.z*0.75); }
